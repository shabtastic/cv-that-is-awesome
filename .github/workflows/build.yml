name: Build CV
on:
  push:
    branches: [main]
  workflow_dispatch:
env:
  # Pinned: `latest` moves quarterly, and a new LaTeX kernel can change the
  # layout with no build failure. Bump deliberately and compare the PDFs.
  TEXLIVE_IMAGE: ghcr.io/xu-cheng/texlive-full:20261001
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Gate everything (release + website sync) on the bib linter: a
      # newest-first inversion is a visible defect in the rendered CV.
      - name: Validate bibliographies
        run: python3 scripts/validate_bib.py
      - name: Run tests
        run: |
          pip install -r requirements-dev.txt
          python3 -m pytest tests/ -q
      - name: Build cv-full.pdf
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          latexmk_use_xelatex: true
          docker_image: ${{ env.TEXLIVE_IMAGE }}
          pre_compile: cp config/full.tex cv-preset.tex
          post_compile: mv cv.pdf cv-full.pdf
      - name: Build cv-full-public.pdf
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          latexmk_use_xelatex: true
          docker_image: ${{ env.TEXLIVE_IMAGE }}
          pre_compile: cp config/full-public.tex cv-preset.tex
          post_compile: |
            mv cv.pdf cv-full-public.pdf
            cp cv-full-public.pdf shabnam-hakimi-cv.pdf
      - name: Build cv-industry.pdf
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          latexmk_use_xelatex: true
          docker_image: ${{ env.TEXLIVE_IMAGE }}
          pre_compile: cp config/industry.tex cv-preset.tex
          post_compile: mv cv.pdf cv-industry.pdf
      - name: Build cv-speaking.pdf
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          latexmk_use_xelatex: true
          docker_image: ${{ env.TEXLIVE_IMAGE }}
          pre_compile: cp config/speaking.tex cv-preset.tex
          post_compile: mv cv.pdf cv-speaking.pdf
      - name: Build resume.pdf
        uses: xu-cheng/latex-action@v3
        with:
          root_file: resume.tex
          latexmk_use_xelatex: true
          docker_image: ${{ env.TEXLIVE_IMAGE }}
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: cv-${{ github.sha }}
          name: "CV build ${{ github.sha }}"
          files: |
            cv-full.pdf
            cv-full-public.pdf
            cv-industry.pdf
            cv-speaking.pdf
            shabnam-hakimi-cv.pdf
            resume.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Sync CV to website repo
        env:
          WEBSITE_DEPLOY_TOKEN: ${{ secrets.WEBSITE_DEPLOY_TOKEN }}
        run: |
          git clone https://x-access-token:${WEBSITE_DEPLOY_TOKEN}@github.com/shabtastic/shabweb.git /tmp/shabweb
          cp shabnam-hakimi-cv.pdf /tmp/shabweb/shabnam-hakimi-cv.pdf
          cd /tmp/shabweb
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add shabnam-hakimi-cv.pdf
          git diff --cached --quiet || git commit -m "cv: sync shabnam-hakimi-cv.pdf from cv repo ($(date -u +%Y-%m-%d))"
          git push
